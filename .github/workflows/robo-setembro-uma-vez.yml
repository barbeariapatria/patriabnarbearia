# Execução ÚNICA: reimporta setembro/2026 do CashBarber, substituindo os dados do mês e sem mexer nos assinantes.
# Dispara só quando este arquivo é enviado ao GitHub; é apagado logo em seguida.
name: Robô CashBarber — setembro (uma vez)

on:
  push:
    branches: [main]
    paths: [".github/workflows/robo-setembro-uma-vez.yml"]

concurrency:
  group: robo-cashbarber
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setembro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: CASHBARBER_EMAIL
    defaults:
      run:
        working-directory: robo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Esperar o painel publicar a versão nova
        run: sleep 150
      - name: Instalar o robô
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-audit --no-fund --omit=optional --prefer-offline
      - name: Rodar o robô (setembro/2026)
        env:
          CASHBARBER_EMAIL: ${{ secrets.CASHBARBER_EMAIL }}
          CASHBARBER_PASSWORD: ${{ secrets.CASHBARBER_PASSWORD }}
          CASHBARBER_URL: ${{ vars.CASHBARBER_URL || 'https://painel.cashbarber.com.br' }}
          PAINEL_URL: ${{ secrets.PAINEL_URL }}
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
          NAVEGADOR: chrome
          MODO: sincronizar
          MES: "2026-09"
          SUBSTITUIR: "true"
          MANTER_ASSINANTES: "true"
        run: node sync.mjs
